; Supervisor: worker da fila Laravel (Nexxivo) — template para VPS
; Copie para /etc/supervisor/conf.d/ e ajuste APP_ROOT e usuário se necessário.
; APP_ROOT = diretório da aplicação Laravel (ex: /var/www/nexxivo-app/nexxivo)

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php APP_ROOT/artisan queue:work database --sleep=3 --tries=3 --timeout=300 --max-time=3600
directory=APP_ROOT
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=APP_ROOT/storage/logs/supervisor-worker.log
stopwaitsecs=3600
